<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>C# Deep Dive — обучалка-игра</title>
  <meta name="description" id="metaDesc" content="Интерактивная игра-обучалка по C#: дженерики, вариантность, enumerables, FileStream I/O, делегаты и события, EventBus и паттерны проектирования." />
  <link rel="icon" href="favicon.svg?v=5" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    // apply saved theme + language before first paint so there's no flash
    try { if (localStorage.getItem("csharp-deepdive-theme") === "dark")
      document.documentElement.setAttribute("data-theme", "dark"); } catch (e) {}
    try { if (localStorage.getItem("csharp-deepdive-lang") === "en")
      document.documentElement.lang = "en"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css?v=22" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand" id="brand" data-nav="" role="link" tabindex="0">
        <span class="logo">C#</span>
        <span class="brand-name">Deep Dive<small id="brandTag">обучалка-игра</small></span>
      </div>
      <div class="xp-wrap">
        <span class="xp-badge" id="xp"><b>0 XP</b></span>
        <!-- on phones these three move into the burger dropdown -->
        <button class="btn-burger" id="burgerBtn" aria-expanded="false" aria-controls="controls">☰</button>
        <div class="controls" id="controls">
          <div class="lang-switch" id="langSwitch" role="group">
            <button type="button" data-lang="ru" aria-pressed="true">RU</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <button class="btn-theme" id="themeBtn">🌙</button>
          <button class="btn-reset" id="resetBtn">Сброс</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap" id="app"><!-- rendered by app.js --></main>

  <script src="data.js?v=7"></script>
  <script src="data.en.js?v=1"></script>
  <script src="app.js?v=15"></script>
</body>
</html>
